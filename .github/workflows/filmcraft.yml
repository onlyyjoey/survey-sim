# Builds the FilmCraft video editor (filmcraft-src/, Rust → WebAssembly) and publishes it to
# /filmcraft/ on this repository's GitHub Pages site, so it opens at
# https://onlyyjoey.github.io/survey-sim/filmcraft/ and can be added to the Home Screen.
name: Build FilmCraft web app

on:
  push:
    branches: [main]
    paths:
      - "filmcraft-src/**"
      - ".github/workflows/filmcraft.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: filmcraft-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: filmcraft-src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80

      # Fast path: when only the touch layer's web files changed since the last full build, copy
      # them over the existing build (about a minute) instead of compiling the editor (5+ minutes).
      - name: Decide full or quick update
        id: kind
        working-directory: .
        run: |
          FROM="$(cat filmcraft/BUILT_FROM 2>/dev/null || true)"
          FAST=false
          if [ -n "$FROM" ] && [ -f filmcraft/filmcraft_web_bg.wasm ] && git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            OTHER="$(git diff --name-only "$FROM" HEAD -- filmcraft-src | grep -v '^filmcraft-src/apps/filmcraft-web/web/' || true)"
            if [ -z "$OTHER" ]; then FAST=true; fi
          fi
          echo "fast=$FAST" >> "$GITHUB_OUTPUT"
          echo "quick update: $FAST (last full build from ${FROM:-none})"

      - name: Rust toolchain with the WebAssembly target
        if: steps.kind.outputs.fast != 'true'
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        if: steps.kind.outputs.fast != 'true'
        with:
          workspaces: filmcraft-src
          shared-key: filmcraft-web

      - name: wasm-bindgen CLI (exact version the app needs)
        if: steps.kind.outputs.fast != 'true'
        run: |
          V="$(sed -n 's/^const WASM_BINDGEN: &str = "\(.*\)";$/\1/p' xtask/src/main.rs)"
          echo "wasm-bindgen $V"
          if ! { command -v wasm-bindgen >/dev/null && wasm-bindgen --version | grep -qF "$V"; }; then
            cargo install wasm-bindgen-cli --version "$V" --locked
          fi

      - name: wasm-opt (makes the download much smaller)
        if: steps.kind.outputs.fast != 'true'
        continue-on-error: true
        run: |
          curl -sSL -o /tmp/binaryen.tgz https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz
          tar -xzf /tmp/binaryen.tgz -C /tmp
          echo "/tmp/binaryen-version_123/bin" >> "$GITHUB_PATH"

      - name: Build the web app
        if: steps.kind.outputs.fast != 'true'
        run: |
          wasm-opt --version || echo "wasm-opt not available; building without it"
          cargo xtask web

      - name: Quick update of the touch layer
        if: steps.kind.outputs.fast == 'true'
        working-directory: .
        run: |
          W=filmcraft-src/apps/filmcraft-web/web
          HASH="$(grep -o 'const build = "[0-9a-f]*"' filmcraft/index.html | cut -d'"' -f2)"
          test -n "$HASH"
          for f in "$W"/*; do
            case "$f" in *.attribution) continue;; esac
            cp "$f" filmcraft/
          done
          sed -i "s/__FC_BUILD__/$HASH/g" filmcraft/index.html
          # new URLs for the touch files, so phones fetch them again
          sed -i -E "s/(touch\.(js|css))\?v=[^\"]*/\1?v=$HASH-${GITHUB_SHA::7}/g" filmcraft/index.html
          sed -i "s/__FC_SW_BUILD__/${GITHUB_SHA::12}/" filmcraft/sw.js
          grep -o 'touch.js?v=[^"]*' filmcraft/index.html

      - name: Publish into /filmcraft/
        if: steps.kind.outputs.fast != 'true'
        working-directory: .
        run: |
          DIST=filmcraft-src/target/web/dist
          test -f "$DIST/index.html" && test -f "$DIST/filmcraft_web_bg.wasm"
          rm -rf filmcraft
          mkdir -p filmcraft
          cp -R "$DIST/." filmcraft/
          # new offline cache for every build
          sed -i "s/__FC_SW_BUILD__/${GITHUB_SHA::12}/" filmcraft/sw.js
          echo "$GITHUB_SHA" > filmcraft/BUILT_FROM
          ls -lh filmcraft

      - name: Commit the build
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A filmcraft
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "FilmCraft web build ${GITHUB_SHA::7}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done

      - name: Ask GitHub Pages to rebuild
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages will pick the commit up on its own"

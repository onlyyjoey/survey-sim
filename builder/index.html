<style>
/* Plan-sheet workbench: tool rail | aerial map | properties panel. On a phone the tools are a big labelled dock at the
   bottom, tool options sit just above it, and the panel is a sheet that slides up. Everything you touch is ≥ 44 px. */
:root {
  --paper: #eef0ea; --ink: #1d2420; --muted: #5d675f; --line: #c9cfc4; --panel: #f8f9f5; --raise: #ffffff;
  --accent: #e2580b; --accent-ink: #ffffff; --survey: #1f6f8b; --good: #2f7d3a; --warn: #b7791f; --bad: #b42318;

  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --rail: 72px; --panelw: 360px; --head: 54px; --ctl: 36px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #151917; --ink: #e6ebe4; --muted: #a3ada4; --line: #333d37; --panel: #1b201d; --raise: #252c28;
  --accent: #ff7a2f; --accent-ink: #1a1208; --survey: #5fb3cf; --good: #6cc47a; --warn: #e0a84a; --bad: #f07167; --map-bg: #0f1210; --chip: #2c342f; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #151917; --ink: #e6ebe4; --muted: #a3ada4; --line: #333d37; --panel: #1b201d; --raise: #252c28;
  --accent: #ff7a2f; --accent-ink: #1a1208; --survey: #5fb3cf; --good: #6cc47a; --warn: #e0a84a; --bad: #f07167; --map-bg: #0f1210; --chip: #2c342f; color-scheme: dark }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--f-body); overflow: hidden; -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, .mono { -webkit-user-select: text; user-select: text; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: var(--head) 1fr; grid-template-columns: var(--rail) 1fr var(--panelw); grid-template-areas: "head head head" "rail map panel"; }
header.top { grid-area: head; display: flex; align-items: center; gap: 8px; padding-top: env(safe-area-inset-top, 0px); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
.brand { font: 700 20px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.brand b { color: var(--accent); }
.proj { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.proj input { border: 0; background: transparent; font: 600 16px/1.15 var(--f-body); padding: 3px 6px; border-radius: 6px; min-width: 0; width: 100%; }
.proj input:focus { background: var(--chip); }
.proj small { color: var(--muted); font: 500 11.5px/1.2 var(--f-mono); padding-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbtn { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); font-weight: 600; white-space: nowrap; }
.hbtn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hbtn svg { width: 18px; height: 18px; }

.status.ok { color: var(--good); } .status.err { color: var(--bad); }

.tool { width: 60px; min-height: 56px; border-radius: 12px; border: 1px solid transparent; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink); flex: none; padding: 4px 2px; }

#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.toolbar { position: absolute; left: 10px; top: 10px; right: 64px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
.toolbar > * { pointer-events: auto; }
.tb { display: flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--panel) 95%, transparent); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; box-shadow: 0 2px 12px rgb(0 0 0 / .2); flex-wrap: wrap; }
.tb label { font: 600 12px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tb select, .tb input[type=number] { height: var(--ctl); border-radius: 8px; border: 1px solid var(--line); background: var(--raise); padding: 0 8px; }
.tb input[type=number] { width: 72px; font-family: var(--f-mono); }
.tb input[type=range] { width: 110px; accent-color: var(--accent); }
.tb .val { font: 500 12px var(--f-mono); min-width: 38px; }

.tb button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0 !important; border-radius: 0 !important; background: var(--raise); }
.seg button + button { border-left: 1px solid var(--line) !important; }
.seg button.on { background: var(--ink); color: var(--paper); }
.hud { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 8px; align-items: end; pointer-events: none; flex-wrap: wrap; }
.coord { background: rgb(15 18 16 / .8); color: #e8eee6; font: 500 12px/1.5 var(--f-mono); padding: 6px 9px; border-radius: 8px; font-variant-numeric: tabular-nums; }
.coord b { color: #ffb37a; font-weight: 500; }
.selbar { position: absolute; right: 10px; top: 96px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.selbar button { height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; display: inline-flex; gap: 7px; align-items: center; box-shadow: 0 2px 12px rgb(0 0 0 / .25); }
.selbar button.danger { color: #fff; background: var(--bad); border-color: var(--bad); }
.selbar button.on { background: var(--ink); color: var(--paper); }
.selbar svg { width: 18px; height: 18px; }
.zoombtns { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoombtns button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font: 600 20px var(--f-mono); box-shadow: 0 2px 10px rgb(0 0 0 / .2); }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; background: rgb(15 18 16 / .86); color: #f1f5ef; padding: 8px 14px; border-radius: 20px; font-size: 14px; pointer-events: none; max-width: calc(100% - 140px); text-align: center; }
aside.panel { grid-area: panel; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.grab { display: none; }
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { flex: 1; height: 46px; border: 0; background: transparent; font: 700 14px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .count { font: 500 11px var(--f-mono); background: var(--chip); border-radius: 8px; padding: 0 6px; margin-left: 3px; }
.pane { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 16px; min-height: 0; -webkit-overflow-scrolling: touch; }
.sect { display: flex; flex-direction: column; gap: 9px; }
.sect h3 { margin: 0; font: 700 14px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.row { display: grid; grid-template-columns: 116px 1fr; gap: 10px; align-items: center; }
.row > span { color: var(--muted); font-size: 14px; }
.row input[type=text], .row input[type=number], .row select, textarea { width: 100%; min-width: 0; height: 40px; border-radius: 9px; border: 1px solid var(--line); background: var(--raise); padding: 0 10px; }
textarea { height: auto; min-height: 84px; padding: 9px 10px; resize: vertical; line-height: 1.4; }
.row input[type=range] { width: 100%; accent-color: var(--accent); height: 30px; }
.mono { font-family: var(--f-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 13.5px; margin: 0; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); font-weight: 600; font-size: 14.5px; }
.btn:disabled { opacity: .45; }
.btn.danger { color: var(--bad); }
.btn.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { min-height: 34px; padding: 0 10px; font-size: 13.5px; }
.list { display: flex; flex-direction: column; gap: 2px; }
.li { display: grid; grid-template-columns: 16px 1fr auto; gap: 10px; align-items: center; min-height: 44px; padding: 6px 10px; border-radius: 10px; border: 1px solid transparent; background: transparent; text-align: left; width: 100%; }
.li:hover { background: var(--chip); }
.li.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }

.grp { font: 700 12px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 8px; display: flex; align-items: center; gap: 8px; min-height: 30px; }
.grp input { accent-color: var(--accent); width: 18px; height: 18px; }
.mcard { border: 1px solid var(--line); border-radius: 12px; background: var(--raise); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.mcard.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.mhead { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.mid { font: 600 12px var(--f-mono); background: var(--ink); color: var(--paper); border-radius: 5px; padding: 3px 7px; }
.mtitle { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; background: transparent; text-align: left; padding: 6px 0; min-height: 36px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 500 12px var(--f-mono); padding: 3px 8px; border-radius: 12px; background: var(--chip); color: var(--ink); display: inline-flex; align-items: center; gap: 5px; }
.chip.warn { background: color-mix(in srgb, var(--warn) 24%, transparent); }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgb(0 0 0 / .35); }
.tip { border: 1px solid color-mix(in srgb, #ffcc00 55%, var(--line)); background: color-mix(in srgb, #ffcc00 9%, var(--raise)); border-radius: 10px; padding: 9px 11px; font-size: 13.5px; display: flex; flex-direction: column; gap: 3px; }
.tip b.h { font: 700 12px var(--f-display); letter-spacing: .08em; color: #b8860b; }
:root[data-theme="dark"] .tip b.h { color: #ffcc00; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tip b.h { color: #ffcc00; } }
.tip div { display: grid; grid-template-columns: 62px 1fr; gap: 8px; }
.tip em { font-style: normal; color: var(--muted); font: 600 11px var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding-top: 2px; }
.swatches { display: flex; gap: 7px; flex-wrap: wrap; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); }
.swatch.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--accent); }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.checks label { display: inline-flex; gap: 7px; align-items: center; font-size: 14px; min-height: 32px; }
.checks input { accent-color: var(--accent); width: 18px; height: 18px; }
.wl { display: grid; grid-template-columns: 1fr 62px 104px 30px; gap: 6px; align-items: center; }
.wl input, .wl select { height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); padding: 0 6px; min-width: 0; width: 100%; }
.wl .x { border: 0; background: transparent; color: var(--muted); font-size: 20px; }
.tag { font: 600 10px var(--f-mono); padding: 1px 6px; border-radius: 5px; text-transform: uppercase; }
.tag.game { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); }
.tag.new { background: color-mix(in srgb, var(--survey) 22%, transparent); color: var(--survey); }
.modal { position: fixed; inset: 0; background: rgb(8 10 9 / .55); display: grid; place-items: center; z-index: 50; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: min(720px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; box-shadow: 0 20px 50px rgb(0 0 0 / .35); min-width: 0; }
.dlg > header { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.dlg h2 { margin: 0; font: 700 20px var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.dlg .body { padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; min-height: 0; flex: 1 1 auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.dlg .body > * { flex-shrink: 0; }
.dlg > header, .dlg .foot { flex: none; }
.dlg .foot { padding: 12px 14px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.projgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.pcard { text-align: left; border: 1px solid var(--line); border-radius: 12px; background: var(--raise); padding: 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pcard b { font-size: 15px; } .pcard small { color: var(--muted); font-size: 13px; }
.pcard .tag { align-self: flex-start; }
/* add catalog */
.search { position: relative; }
.search input { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); padding: 0 14px 0 42px; font-size: 17px; }
.search svg { position: absolute; left: 13px; top: 14px; width: 20px; height: 20px; color: var(--muted); }
.cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; flex: none; }
.cats button { flex: none; height: 36px; padding: 0 13px; border-radius: 18px; border: 1px solid var(--line); background: var(--raise); font-weight: 600; font-size: 14px; }
.cats button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile { text-align: left; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; min-height: 58px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); }
.tile:active { transform: scale(.98); }
.tile i { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-style: normal; font-size: 19px; border: 1px solid rgb(0 0 0 / .2); }
.tile b { font-size: 14.5px; line-height: 1.15; display: block; }
.tile small { color: var(--muted); font-size: 12px; line-height: 1.2; display: block; }
.tilegrp { font: 700 13px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 -2px; }
#three { position: absolute; inset: 0; background: #cfd7d6; z-index: 5; }
#three canvas { width: 100% !important; height: 100% !important; display: block; touch-action: none; }
#three .close3d { position: absolute; right: 10px; top: 10px; }
#three .t3hint { position: absolute; left: 10px; top: 12px; background: rgb(15 18 16 / .78); color: #eef; padding: 6px 10px; border-radius: 8px; font-size: 13px; }
.sheetbtn, .selbar .sheetbtn { display: none; }

  :root { --panelw: 0px; --rail: 0px; --head: calc(56px + env(safe-area-inset-top, 0px)); --ctl: 42px; }

  input, select, textarea { font-size: 16px !important; }                      /* (iOS zooms the page into anything smaller) */
  .app { grid-template-columns: 1fr; grid-template-rows: var(--head) 1fr auto; grid-template-areas: "head" "map" "rail"; }
  nav.rail { flex-direction: row; overflow-x: auto; overflow-y: hidden; border-right: 0; border-top: 1px solid var(--line); gap: 2px; padding: 6px max(6px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); scrollbar-width: none; }
  nav.rail::-webkit-scrollbar { display: none; }
  .tool { width: 58px; min-height: 58px; }
  .rail .sep { display: none; }
  .rail .sep { width: 1px; height: auto; margin: 6px 3px; }
  .toolbar { top: auto; bottom: 10px; left: 8px; right: 8px; }
  .tb { padding: 6px 8px; gap: 6px; row-gap: 6px; }
  .tb label { font-size: 11px; }
  #toast { top: auto !important; bottom: 128px !important; }
  .toolbar::-webkit-scrollbar { display: none; }
  .tb input[type=range] { width: 120px; }
  .hud { top: 8px; bottom: auto; left: 8px; }
  .coord { font-size: 11px; padding: 4px 7px; }
  #scale { display: none; }
  .zoombtns { top: 8px; bottom: auto; right: 8px; flex-direction: row; }
  .zoombtns button { width: 46px; height: 46px; }
  .selbar { top: 62px; right: 8px; }
  .hint { bottom: 70px; max-width: calc(100% - 24px); font-size: 14.5px; }
  aside.panel { position: fixed; left: 0; right: 0; bottom: 0; height: 74%; z-index: 20; border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; box-shadow: 0 -10px 30px rgb(0 0 0 / .35); transform: translateY(102%); transition: transform .24s ease; padding-bottom: env(safe-area-inset-bottom, 0px); }
  aside.panel.open { transform: none; }
  .grab { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px 4px; }
  .grab i { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }

  .brand { display: none; }
  .row { grid-template-columns: 1fr; gap: 5px; }
  .row > span { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-family: var(--f-display); }
  .row input[type=text], .row input[type=number], .row select { height: 46px; }
  .btn { min-height: 46px; } .btn.sm { min-height: 40px; }

  .tiles { grid-template-columns: 1fr 1fr; }
  .dlg { border-radius: 18px; }
  .modal { place-items: end center; padding-bottom: 0; padding-left: 0; padding-right: 0; }
  .modal .dlg { border-radius: 18px 18px 0 0; max-height: 88vh; max-height: 88dvh; padding-bottom: env(safe-area-inset-bottom, 0px); }

@media (prefers-reduced-motion: reduce) { aside.panel { transition: none; } }
</style>

  const choose = b => { const [kind, key] = b.dataset.it.split(':');
    recent = [b.dataset.it, ...recent.filter(r => r !== b.dataset.it)].slice(0, 8); try { localStorage.setItem('ssb.recent', JSON.stringify(recent)); } catch (er) { /* blocked */ }

  let down = null;
  $('modal').querySelector('.dlg').addEventListener('pointerdown', e => { const b = e.target.closest('[data-it], [data-cat]'); down = b ? { b, x: e.clientX, y: e.clientY, id: e.pointerId } : null; });

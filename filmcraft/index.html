<!doctype html>
<!-- FilmCraft moved to its own repository: https://github.com/onlyyjoey/Video-editor -->
<meta charset="utf-8"><title>FilmCraft moved</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
  // drop the old offline copy so this page isn't served from cache again
  if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
  if (window.caches) caches.keys().then((ks) => ks.forEach((k) => k.startsWith("filmcraft-") && caches.delete(k)));
  location.replace("https://onlyyjoey.github.io/Video-editor/" + location.search + location.hash);
</script>
<body style="background:#1b1c1f;color:#eee;font:16px -apple-system,sans-serif;padding:24px">
<p>FilmCraft has moved to <a style="color:#7ab7ff" href="https://onlyyjoey.github.io/Video-editor/">onlyyjoey.github.io/Video-editor</a>.</p>
